    <script>
      // Automatically clean up stale ServiceWorker / Workbox caches that intercept dev requests
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        }).catch(function() {});
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        }).catch(function() {});
      }

      // Safe defensive guard against Chrome experimental AI Origin Trials (writer / rewriter) warnings
      try {
        if (typeof window !== 'undefined' && 'ai' in window && window.ai) {
          if (!('writer' in window.ai)) {
            Object.defineProperty(window.ai, 'writer', { value: null, writable: true, configurable: true });
          }
          if (!('rewriter' in window.ai)) {
            Object.defineProperty(window.ai, 'rewriter', { value: null, writable: true, configurable: true });
          }
        }
      } catch (e) {}
    </script>

    <script>
      // Register Progressive Web App Service Worker
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function(reg) {
              console.log('[PWA] Service Worker active:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[PWA] Service Worker registration skipped:', err);
            });
        });
      }
    </script>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Escape the Police: Cyber Pursuit</title>
    <script>
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          const text = args.map(a => (typeof a === 'object' ? (a && a.message ? a.message : JSON.stringify(a)) : String(a))).join(' ');
          if (
            text.includes('WebSocket') ||
            text.includes('websocket') ||
            text.includes('[vite]') ||
            text.includes('HMR') ||
            text.includes('ws://') ||
            text.includes('wss://')
          ) {
            return;
          }
          try {
            fetch('/api/client-log', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: 'console.error', message: text })
            }).catch(() => {});
          } catch {}
          origError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          const msg = e && e.message ? e.message : String(e);
          if (msg.includes('WebSocket') || msg.includes('[vite]') || msg.includes('HMR')) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }
          try {
            fetch('/api/client-log', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: 'window.error', message: msg, filename: e.filename, lineno: e.lineno })
            }).catch(() => {});
          } catch {}
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          const reason = e && e.reason ? (e.reason.message || String(e.reason)) : String(e);
          if (reason.includes('WebSocket') || reason.includes('[vite]') || reason.includes('HMR')) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }
          try {
            fetch('/api/client-log', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: 'unhandledrejection', message: reason })
            }).catch(() => {});
          } catch {}
        });
      })();
    </script>

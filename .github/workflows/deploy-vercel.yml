name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check TypeScript & Lint
        run: npm run lint

      - name: Build Web Application
        run: npm run build:web

      - name: Deploy to Vercel Production
        if: github.event_name != 'pull_request' && env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Notice if Vercel Secrets Not Configured
        if: github.event_name != 'pull_request' && env.VERCEL_TOKEN == ''
        run: echo "::notice title=Vercel Token Notice::Build and TypeScript checks passed successfully! To enable automatic deployment to Vercel, please configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in GitHub Repository Secrets."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
